<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin | Primefix Technical Service</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Admin-only additions - reuses styles.css variables/fonts so it matches the live site exactly */
        body { background: var(--color-background-alt); padding-bottom: 60px; }

        .admin-page { display: none; }

        .admin-header {
            padding: 40px 0 8px;
        }
        .admin-header .section-title { text-align: left; margin-bottom: 8px; }
        .admin-header .section-subtitle { text-align: left; margin: 0; }

        .admin-toolbar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 24px;
        }

        .login-wrap {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
        }
        .login-card {
            background: #ffffff;
            padding: 48px 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: var(--shadow-md);
        }
        .login-card .hero-badge { margin-bottom: 20px; }
        .login-card h1 {
            font-size: 28px;
            font-weight: 800;
            color: var(--color-primary);
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }
        .login-card p.lead {
            color: var(--color-text-light);
            font-size: 15px;
            margin-bottom: 28px;
        }
        .field { margin-bottom: 18px; }
        .field label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--color-primary);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .field input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--color-border);
            font-size: 15px;
            font-family: var(--font-primary);
            transition: var(--transition);
        }
        .field input:focus { outline: none; border-color: var(--color-accent); }
        .login-error {
            background: #fdecea;
            color: #a33;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 20px;
            display: none;
            border-left: 3px solid #c0392b;
        }
        .full-width { width: 100%; }

        .upload-zone {
            background: #ffffff;
            border: 2px dashed var(--color-border);
            padding: 40px 24px;
            text-align: center;
            margin-bottom: 48px;
            transition: var(--transition);
        }
        .upload-zone.dragover { border-color: var(--color-accent); background: var(--color-background-alt); }
        .upload-zone h3 {
            font-size: 20px;
            font-weight: 700;
            color: var(--color-primary);
            margin-bottom: 8px;
        }
        .upload-zone p {
            color: var(--color-text-light);
            font-size: 15px;
            margin-bottom: 24px;
        }
        .upload-zone input[type="file"] { display: none; }
        .upload-status {
            margin-top: 20px;
            font-size: 14px;
            font-weight: 600;
            color: var(--color-text-light);
            min-height: 20px;
        }

        .admin-portfolio-item { position: relative; }
        .admin-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: var(--color-primary);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            padding: 5px 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            z-index: 2;
        }
        .admin-delete-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 34px;
            height: 34px;
            border: none;
            background: rgba(26, 26, 26, 0.85);
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            transition: var(--transition);
        }
        .admin-delete-btn:hover { background: #c0392b; }

        .empty-state {
            color: var(--color-text-light);
            font-size: 15px;
            padding: 32px 0;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Login -->
    <div class="login-wrap" id="loginScreen">
        <div class="login-card">
            <div class="hero-badge">Primefix Admin</div>
            <h1>Manage Project Media</h1>
            <p class="lead">Log in to add or remove photos and videos.</p>
            <div class="login-error" id="loginError"></div>
            <form id="loginForm">
                <div class="field">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" autocomplete="username" required>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary-large full-width" id="loginBtn">Log In</button>
            </form>
        </div>
    </div>

    <!-- Dashboard -->
    <div class="admin-page" id="adminPage">
        <div class="container">
            <div class="admin-header">
                <h2 class="section-title">Project Media</h2>
                <p class="section-subtitle">Everything here appears in the live Projects section on your website.</p>
            </div>
            <div class="admin-toolbar">
                <button class="btn btn-secondary-large" id="logoutBtn">Log Out</button>
            </div>

            <div class="upload-zone" id="uploadZone">
                <h3>Add Photos or Videos</h3>
                <p>Choose from your gallery, camera roll, or files - any device.</p>
                <button type="button" class="cta-button" id="chooseFilesBtn">Choose Files</button>
                <input type="file" id="fileInput" accept="image/*,video/*" multiple>
                <div class="upload-status" id="uploadStatus"></div>
            </div>

            <div class="portfolio-grid" id="mediaGrid"></div>
            <div class="empty-state" id="emptyState" style="display:none;">No photos or videos yet.</div>
        </div>
    </div>

<script>
const loginScreen = document.getElementById('loginScreen');
const adminPage = document.getElementById('adminPage');
const loginForm = document.getElementById('loginForm');
const loginError = document.getElementById('loginError');
const loginBtn = document.getElementById('loginBtn');
const logoutBtn = document.getElementById('logoutBtn');
const uploadZone = document.getElementById('uploadZone');
const chooseFilesBtn = document.getElementById('chooseFilesBtn');
const fileInput = document.getElementById('fileInput');
const uploadStatus = document.getElementById('uploadStatus');
const mediaGrid = document.getElementById('mediaGrid');
const emptyState = document.getElementById('emptyState');

function showAdmin() {
    loginScreen.style.display = 'none';
    adminPage.style.display = 'block';
    loadMedia();
}
function showLogin() {
    adminPage.style.display = 'none';
    loginScreen.style.display = 'flex';
}

async function checkSession() {
    try {
        const res = await fetch('/api/me', { credentials: 'include' });
        res.ok ? showAdmin() : showLogin();
    } catch {
        showLogin();
    }
}

loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    loginError.style.display = 'none';
    loginBtn.disabled = true;
    loginBtn.textContent = 'Logging in...';

    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    try {
        const res = await fetch('/api/login', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        if (res.ok) {
            loginForm.reset();
            showAdmin();
        } else {
            const data = await res.json().catch(() => ({}));
            loginError.textContent = data.error || 'Login failed. Check your username and password.';
            loginError.style.display = 'block';
        }
    } catch {
        loginError.textContent = 'Something went wrong. Check your connection and try again.';
        loginError.style.display = 'block';
    } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Log In';
    }
});

logoutBtn.addEventListener('click', async () => {
    await fetch('/api/logout', { method: 'POST', credentials: 'include' });
    showLogin();
});

chooseFilesBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
    if (fileInput.files.length) uploadFiles(fileInput.files);
});

['dragover', 'dragenter'].forEach(evt => {
    uploadZone.addEventListener(evt, (e) => { e.preventDefault(); uploadZone.classList.add('dragover'); });
});
['dragleave', 'drop'].forEach(evt => {
    uploadZone.addEventListener(evt, (e) => { e.preventDefault(); uploadZone.classList.remove('dragover'); });
});
uploadZone.addEventListener('drop', (e) => {
    if (e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files);
});

async function uploadFiles(fileList) {
    const formData = new FormData();
    for (const file of fileList) formData.append('file', file);

    uploadStatus.textContent = `Uploading ${fileList.length} file${fileList.length > 1 ? 's' : ''}...`;
    chooseFilesBtn.disabled = true;

    try {
        const res = await fetch('/api/upload', { method: 'POST', credentials: 'include', body: formData });
        const data = await res.json();
        if (!res.ok) {
            uploadStatus.textContent = data.error || 'Upload failed.';
        } else {
            const uploadedCount = data.uploaded?.length || 0;
            const skippedCount = data.skipped?.length || 0;
            let msg = `Added ${uploadedCount} file${uploadedCount !== 1 ? 's' : ''}.`;
            if (skippedCount) msg += ` ${skippedCount} skipped.`;
            uploadStatus.textContent = msg;
            loadMedia();
        }
    } catch {
        uploadStatus.textContent = 'Upload failed. Check your connection and try again.';
    } finally {
        chooseFilesBtn.disabled = false;
        fileInput.value = '';
    }
}

async function loadMedia() {
    mediaGrid.innerHTML = '';
    try {
        const res = await fetch('/api/list', { credentials: 'include' });
        const data = await res.json();
        const items = data.items || [];

        emptyState.style.display = items.length ? 'none' : 'block';

        items.forEach(item => {
            const el = document.createElement('div');
            el.className = 'portfolio-item admin-portfolio-item';
            const media = item.type === 'video'
                ? `<video src="${item.url}" muted></video>`
                : `<img src="${item.url}" alt="Project media" loading="lazy">`;
            el.innerHTML = `
                <span class="admin-badge">${item.type}</span>
                <button class="admin-delete-btn" data-key="${item.key}" title="Remove">&times;</button>
                ${media}
            `;
            mediaGrid.appendChild(el);
        });

        mediaGrid.querySelectorAll('.admin-delete-btn').forEach(btn => {
            btn.addEventListener('click', () => deleteItem(btn.dataset.key));
        });
    } catch {
        emptyState.textContent = 'Could not load media. Check your connection.';
        emptyState.style.display = 'block';
    }
}

async function deleteItem(key) {
    if (!confirm('Remove this from the live site?')) return;
    try {
        const res = await fetch('/api/delete', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ key })
        });
        res.ok ? loadMedia() : alert('Could not remove this item. Try again.');
    } catch {
        alert('Could not remove this item. Check your connection.');
    }
}

checkSession();
</script>
</body>
</html>
